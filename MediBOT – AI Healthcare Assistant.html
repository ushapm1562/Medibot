<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediBOT – AI Healthcare Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e3b43;--bg:#eef6f5;--card:#fff;--teal:#1b8a8a;--teal2:#136b6b;--amber:#f2b544;--line:#cfe3e1;--mut:#53767a;--bad:#c0392b;--ok:#1e8e5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e3f2f1;--bg:#0b1f23;--card:#12313a;--line:#24505a;--mut:#8fb5b8;--teal:#37b5b0;--teal2:#2a9792}}
:root[data-theme="dark"]{--ink:#e3f2f1;--bg:#0b1f23;--card:#12313a;--line:#24505a;--mut:#8fb5b8;--teal:#37b5b0;--teal2:#2a9792}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans','Noto Sans Kannada','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil',system-ui,sans-serif;line-height:1.55}
header{background:var(--teal2);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
header b{font-size:1.25rem}
header span{opacity:.85;font-size:.85rem}
.cross{width:34px;height:34px;border-radius:9px;background:#fff;position:relative;flex:none}
.cross:before,.cross:after{content:"";position:absolute;background:var(--teal2);border-radius:2px}
.cross:before{left:14px;top:7px;width:6px;height:20px}.cross:after{left:7px;top:14px;width:20px;height:6px}
#steps{display:flex;gap:6px;padding:12px 18px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
#steps i{font-style:normal;white-space:nowrap;font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
#steps i.on{background:var(--teal);color:#fff;border-color:var(--teal)}
#steps i.done{border-color:var(--teal);color:var(--teal)}
main{max-width:760px;margin:0 auto;padding:18px}
h2{margin:6px 0 14px;font-size:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.opt small{display:block;color:var(--mut)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.92rem}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
button.go{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
button.go:hover{background:var(--teal2)}
button.alt{background:transparent;color:var(--teal);border:1.5px solid var(--teal);margin-left:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.93rem}
th{color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;color:#fff}
.High{background:var(--bad)}.Medium{background:#d98a00}.Low{background:var(--ok)}
.hint{color:var(--mut);font-size:.85rem}
.warn{border-left:5px solid var(--amber);background:var(--card);padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.88rem}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 16px}
.bar div{height:100%;background:var(--teal);width:0;transition:width 1s}
.stage{display:flex;gap:10px;align-items:center;padding:7px 0;color:var(--mut)}
.stage.on{color:var(--ink);font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.stage.on .dot{background:var(--ok);border-color:var(--ok)}
.stars button{font-size:1.6rem;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--amber)}
.tot{font-size:1.2rem;font-weight:700}
#vbar{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:9}
.vb{border:0;border-radius:99px;padding:12px 16px;background:var(--teal2);color:#fff;font:inherit;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
.vb.on{background:var(--amber);color:#1a1a1a}
#toast{position:fixed;left:14px;right:14px;bottom:76px;background:#222;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:10;font-size:.9rem}
.mic{margin-top:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;cursor:pointer;font:inherit}
.mic.rec{background:var(--bad);color:#fff}
main{padding-bottom:80px}
h4{margin:12px 0 4px}ul{margin:4px 0;padding-left:1.3em}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff}
.msg.dr{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg small{display:block;opacity:.7;font-size:.7rem}
.call{text-align:center}
.av{width:96px;height:96px;border-radius:50%;background:var(--teal);color:#fff;font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:12px auto}
.ring{animation:ring 1.4s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(27,138,138,.6)}100%{box-shadow:0 0 0 36px rgba(27,138,138,0)}}
.vid{position:relative;height:260px;border-radius:12px;background:#0b1f23;margin-bottom:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.self{position:absolute;right:10px;bottom:10px;width:90px;height:120px;border-radius:10px;background:#24505a;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.self video{width:100%;height:100%;object-fit:cover}
.wave{display:flex;gap:4px;align-items:center;height:30px;justify-content:center}
.wave i{width:5px;height:8px;background:var(--teal);border-radius:3px;animation:wv 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{50%{height:28px}}
.chip.on{background:var(--bad);border-color:var(--bad)}
@media(prefers-reduced-motion:reduce){.bar div{transition:none}.ring,.wave i{animation:none}}
</style>
</head>
<body>
<header><div class="cross"></div><div><b id="hn">MediBOT</b><br><span id="ht">AI-Powered Healthcare Assistant</span></div></header>
<div id="steps"></div>
<div id="vbar"><button id="vbtn" class="vb" aria-pressed="false" aria-label="Voice assistant" onclick="toggleVoice()">🔊 Voice</button><button class="vb" aria-label="Read again" onclick="replay()">↻</button></div><div id="toast" role="status"></div><main id="app"></main><footer id="ft" class="hint" style="text-align:center;padding:10px 18px 24px"></footer>
<script>
const FEE=50,DEL=30;
/* English key -> "kn|hi|te|ta" */
const D={
"MediBOT":"ಮೆಡಿಬಾಟ್|मेडीबॉट|మెడిబాట్|மெடிபாட்",
"AI-Powered Healthcare Assistant":"ಎಐ ಆಧಾರಿತ ಆರೋಗ್ಯ ಸಹಾಯಕ|एआई-संचालित स्वास्थ्य सहायक|ఏఐ ఆధారిత ఆరోగ్య సహాయకుడు|AI அடிப்படையிலான சுகாதார உதவியாளர்",
"Demo project – not a substitute for a real doctor.":"ಇದು ಡೆಮೊ ಪ್ರಾಜೆಕ್ಟ್ – ನಿಜವಾದ ವೈದ್ಯರಿಗೆ ಪರ್ಯಾಯವಲ್ಲ.|यह डेमो प्रोजेक्ट है – असली डॉक्टर का विकल्प नहीं।|ఇది డెమో ప్రాజెక్ట్ – నిజమైన వైద్యునికి ప్రత్యామ్నాయం కాదు.|இது டெமோ திட்டம் – உண்மையான மருத்துவருக்கு மாற்று அல்ல.",
"Create your account":"ಖಾತೆ ರಚಿಸಿ|अपना खाता बनाएं|మీ ఖాతాను సృష్టించండి|உங்கள் கணக்கை உருவாக்குங்கள்",
"Phone number (10 digits)":"ಫೋನ್ ಸಂಖ್ಯೆ (10 ಅಂಕಿ)|फोन नंबर (10 अंक)|ఫోన్ నంబర్ (10 అంకెలు)|தொலைபேசி எண் (10 இலக்கம்)",
"Full name":"ಪೂರ್ಣ ಹೆಸರು|पूरा नाम|పూర్తి పేరు|முழு பெயர்",
"OTP (demo: 1234)":"ಒಟಿಪಿ (ಡೆಮೊ: 1234)|ओटीपी (डेमो: 1234)|ఓటీపీ (డెమో: 1234)|OTP (டெமோ: 1234)",
"Create a password":"ಪಾಸ್‌ವರ್ಡ್ ರಚಿಸಿ|पासवर्ड बनाएं|పాస్‌వర్డ్ సృష్టించండి|கடவுச்சொல்லை உருவாக்குங்கள்",
"Confirm password":"ಪಾಸ್‌ವರ್ಡ್ ದೃಢೀಕರಿಸಿ|पासवर्ड की पुष्टि करें|పాస్‌వర్డ్ నిర్ధారించండి|கடவுச்சொல்லை உறுதிப்படுத்துங்கள்",
"Allow location access":"ಸ್ಥಳದ ಅನುಮತಿ ನೀಡಿ|स्थान की अनुमति दें|లొకేషన్ అనుమతి ఇవ్వండి|இருப்பிட அனுமதி வழங்குங்கள்",
"Enter a valid 10-digit phone number.":"ಸರಿಯಾದ 10 ಅಂಕಿಯ ಫೋನ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.|सही 10 अंकों का फोन नंबर डालें।|సరైన 10 అంకెల ఫోన్ నంబర్ నమోదు చేయండి.|சரியான 10 இலக்க எண்ணை உள்ளிடுங்கள்.",
"Incorrect OTP. Try 1234.":"ತಪ್ಪು ಒಟಿಪಿ. 1234 ಪ್ರಯತ್ನಿಸಿ.|गलत ओटीपी। 1234 डालें।|తప్పు ఓటీపీ. 1234 ప్రయత్నించండి.|தவறான OTP. 1234 உள்ளிடுங்கள்.",
"Passwords don't match.":"ಪಾಸ್‌ವರ್ಡ್‌ಗಳು ಹೊಂದಿಕೆಯಾಗುತ್ತಿಲ್ಲ.|पासवर्ड मेल नहीं खाते।|పాస్‌వర్డ్‌లు సరిపోలలేదు.|கடவுச்சொற்கள் பொருந்தவில்லை.",
"Continue":"ಮುಂದುವರಿಸಿ|आगे बढ़ें|కొనసాగించండి|தொடரவும்",
"Back":"ಹಿಂದೆ|पीछे|వెనుకకు|பின்செல்",
"Dashboard":"ಡ್ಯಾಶ್‌ಬೋರ್ಡ್|डैशबोर्ड|డ్యాష్‌బోర్డ్|டாஷ்போர்டு",
"Hi":"ನಮಸ್ಕಾರ|नमस्ते|నమస్కారం|வணக்கம்",
"New consultation":"ಹೊಸ ಸಲಹೆ|नई सलाह|కొత్త సంప్రదింపు|புதிய ஆலோசனை",
"Medical history":"ಮೆಡಿಕಲ್ ಇತಿಹಾಸ|मेडिकल इतिहास|వైద్య చరిత్ర|மருத்துவ வரலாறு",
"No past consultations yet.":"ಇನ್ನೂ ಯಾವುದೇ ಹಿಂದಿನ ಸಲಹೆ ಇಲ್ಲ.|अभी तक कोई पिछली सलाह नहीं।|ఇంకా గత సంప్రదింపులు లేవు.|இதுவரை ஆலோசனைகள் இல்லை.",
"MediBOT connects you with AI health guidance, real doctors, and medicine delivery.":"ಮೆಡಿಬಾಟ್ ನಿಮ್ಮನ್ನು ಎಐ ಆರೋಗ್ಯ ಸಲಹೆ, ನಿಜವಾದ ವೈದ್ಯರು ಮತ್ತು ಔಷಧಿ ಡೆಲಿವರಿಗೆ ಸಂಪರ್ಕಿಸುತ್ತದೆ.|मेडीबॉट आपको एआई स्वास्थ्य सलाह, असली डॉक्टर और दवा डिलीवरी से जोड़ता है।|మెడిబాట్ మిమ్మల్ని ఏఐ ఆరోగ్య సలహా, నిజమైన వైద్యులు, మందుల డెలివరీతో కలుపుతుంది.|மெடிபாட் AI சுகாதார வழிகாட்டல், உண்மையான மருத்துவர்கள், மருந்து விநியோகத்துடன் உங்களை இணைக்கிறது.",
"past consultation(s) saved":"ಹಿಂದಿನ ಸಲಹೆಗಳು ಉಳಿಸಲಾಗಿದೆ|पिछली सलाह सहेजी गई|గత సంప్రదింపులు సేవ్ అయ్యాయి|சேமிக்கப்பட்ட ஆலோசனைகள்",
"Condition":"ಸ್ಥಿತಿ|स्थिति|పరిస్థితి|நிலை",
"Risk":"ಅಪಾಯ|जोखिम|ప్రమాదం|ஆபத்து",
"Doctor":"ವೈದ್ಯರು|डॉक्टर|వైద్యుడు|மருத்துவர்",
"Symptoms":"ಲಕ್ಷಣಗಳು|लक्षण|లక్షణాలు|அறிகுறிகள்",
"Describe your symptoms":"ನಿಮ್ಮ ಲಕ್ಷಣಗಳನ್ನು ತಿಳಿಸಿ|अपने लक्षण बताएं|మీ లక్షణాలను తెలపండి|உங்கள் அறிகுறிகளைக் கூறுங்கள்",
"Or describe in your own words":"ಅಥವಾ ನಿಮ್ಮ ಮಾತಿನಲ್ಲಿ ಬರೆಯಿರಿ|या अपने शब्दों में लिखें|లేదా మీ మాటల్లో రాయండి|அல்லது உங்கள் சொற்களில் எழுதுங்கள்",

"e.g. 3 days":"ಉದಾ: 3 ದಿನ|जैसे: 3 दिन|ఉదా: 3 రోజులు|எ.கா: 3 நாள்",
"Severity":"ತೀವ್ರತೆ|गंभीरता|తీవ్రత|தீவிரம்",
"Mild":"ಸ್ವಲ್ಪ|हल्का|స్వల్పం|லேசானது",
"Moderate":"ಮಧ್ಯಮ|मध्यम|మధ్యస్థం|மிதமானது",

"Symptom pattern suggests a possible cardiac issue. Needs urgent medical evaluation.":"ಲಕ್ಷಣಗಳು ಹೃದಯ ಸಮಸ್ಯೆಯ ಸಾಧ್ಯತೆ ತೋರಿಸುತ್ತಿವೆ. ತುರ್ತು ವೈದ್ಯಕೀಯ ಪರೀಕ್ಷೆ ಅಗತ್ಯ.|लक्षण हृदय की समस्या की ओर इशारा करते हैं। तुरंत डॉक्टरी जांच जरूरी है।|లక్షణాలు గుండె సమస్యను సూచిస్తున్నాయి. వెంటనే వైద్య పరీక్ష అవసరం.|அறிகுறிகள் இதயப் பிரச்சினையை சுட்டுகின்றன. உடனடி மருத்துவ பரிசோதனை தேவை.",
"Fever, cough and breathlessness together can indicate a chest infection.":"ಜ್ವರ, ಕೆಮ್ಮು ಮತ್ತು ಉಸಿರಾಟದ ತೊಂದರೆ ಒಟ್ಟಿಗೆ ಇದ್ದರೆ ಎದೆಯ ಸೋಂಕು ಇರಬಹುದು.|बुखार, खांसी और सांस फूलना साथ हों तो छाती का संक्रमण हो सकता है।|జ్వరం, దగ్గు, ఊపిరి ఆడకపోవడం కలిసి ఉంటే ఛాతీ ఇన్ఫెక్షన్ కావచ్చు.|காய்ச்சல், இருமல், மூச்சுத் திணறல் சேர்ந்து இருந்தால் நெஞ்சுத் தொற்றாக இருக்கலாம்.",
"Fever with joint pain and fatigue can match a viral fever pattern.":"ಜ್ವರದ ಜೊತೆ ಕೀಲು ನೋವು ಮತ್ತು ಆಯಾಸ ವೈರಲ್ ಜ್ವರದ ಮಾದರಿಗೆ ಹೊಂದುತ್ತದೆ.|बुखार के साथ जोड़ों का दर्द और थकान वायरल बुखार जैसी है।|జ్వరంతో కీళ్ల నొప్పి, అలసట వైరల్ జ్వరానికి సరిపోతాయి.|காய்ச்சலுடன் மூட்டு வலி, சோர்வு வைரஸ் காய்ச்சலை ஒத்தது.",
"These symptoms together often point to a stomach infection.":"ಈ ಲಕ್ಷಣಗಳು ಒಟ್ಟಿಗೆ ಇದ್ದರೆ ಹೊಟ್ಟೆಯ ಸೋಂಕು ಇರುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚು.|ये लक्षण साथ हों तो अक्सर पेट का संक्रमण होता है।|ఈ లక్షణాలు కలిసి ఉంటే తరచుగా కడుపు ఇన్ఫెక్షన్ అని సూచిస్తాయి.|இந்த அறிகுறிகள் சேர்ந்தால் பெரும்பாலும் வயிற்றுத் தொற்றைக் குறிக்கும்.",

const LC={en:"en-IN",kn:"kn-IN",hi:"hi-IN",te:"te-IN",ta:"ta-IN"};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",4500)}
function pickVoice(){const v=speechSynthesis.getVoices(),l=LC[S.lang];return v.find(x=>x.lang.replace("_","-")===l)||v.find(x=>x.lang.toLowerCase().startsWith(l.slice(0,2)))}
function say(text){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined")return toast(tr(K_CHROME));
  const ss=speechSynthesis;ss.cancel();
  const run=()=>{
    const v=pickVoice();
    if(!v&&S.lang!=="en")toast(tr(K_NOVOICE));
    (text.match(/[^.!?।]+[.!?।]?/g)||[text]).forEach(c=>{const u=new SpeechSynthesisUtterance(c.trim());u.lang=LC[S.lang];if(v)u.voice=v;u.rate=.92;u.onerror=e=>{if(e.error!=="canceled"&&e.error!=="interrupted")toast("Voice error: "+e.error)};ss.speak(u)});
    ss.resume();
  };
  if(ss.getVoices().length)setTimeout(run,150);else{let d=false;const f=()=>{if(!d){d=true;run()}};ss.onvoiceschanged=f;setTimeout(f,800)}
}
function readScreen(){

const K_CHROME="Voice needs Chrome. Open this link in Chrome (not inside another app).",K_NOVOICE="This language's voice is not installed. Install it in phone Settings > Text-to-speech.",K_MIC="The mic is blocked in this viewer. Use your keyboard's mic button to speak, or open the downloaded file in Chrome.",K_NOSP="Could not hear you. Please tap the mic and speak again.",K_LIS="Listening… speak now";
function matchSym(t){const n=x=>x.toLowerCase().replace(/\s+/g,""),tt=n(t);return SYM.filter(x=>tt.includes(n(x))||tt.includes(n(tr(x))))}

function dictate(id,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast(tr(K_CHROME));
  const el=$("#"+id),base=(id==="ph"||!el.value)?"":el.value+" ";let bad=false;
  const r=new SR();r.lang=LC[S.lang];r.interimResults=true;r.continuous=false;
  btn.classList.add("rec");toast(tr(K_LIS));
  r.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;if(id==="ph")t=t.replace(/\D/g,"").slice(0,10);el.value=base+t};
  r.onerror=e=>{bad=true;btn.classList.remove("rec");toast(tr(e.error==="not-allowed"||e.error==="service-not-allowed"?K_MIC:K_NOSP))};
  r.onend=()=>{btn.classList.remove("rec");if(!bad)$("#toast").style.display="none";afterDictate(id)};
  try{r.start()}catch(e){toast(tr(K_CHROME))}
}

if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};

"Your symptoms match this pattern:":"ನಿಮ್ಮ ಲಕ್ಷಣಗಳು ಈ ಸ್ಥಿತಿಗೆ ಹೊಂದುತ್ತವೆ:|आपके लक्षण इस स्थिति से मेल खाते हैं:|మీ లక్షణాలు ఈ పరిస్థితికి సరిపోతాయి:|உங்கள் அறிகுறிகள் இந்த நிலையை ஒத்துள்ளன:",
"This may be serious. Get medical help right now.":"ಇದು ಗಂಭೀರವಾಗಿರಬಹುದು. ಈಗಲೇ ವೈದ್ಯಕೀಯ ಸಹಾಯ ಪಡೆಯಿರಿ.|यह गंभीर हो सकता है। अभी चिकित्सा सहायता लें।|ఇది తీవ్రం కావచ్చు. వెంటనే వైద్య సహాయం పొందండి.|இது கடுமையாக இருக்கலாம். உடனே மருத்துவ உதவி பெறுங்கள்.",
"Please consult a doctor today.":"ದಯವಿಟ್ಟು ಇಂದೇ ವೈದ್ಯರನ್ನು ಭೇಟಿಯಾಗಿ.|कृपया आज ही डॉक्टर से मिलें।|దయచేసి ఈరోజే వైద్యుడిని కలవండి.|தயவுசெய்து இன்றே மருத்துவரைப் பாருங்கள்.",
"Usually mild. Home care is enough; see a doctor if it does not improve.":"ಸಾಮಾನ್ಯವಾಗಿ ಸೌಮ್ಯ. ಮನೆಮದ್ದು ಸಾಕು; ಸುಧಾರಿಸದಿದ್ದರೆ ವೈದ್ಯರನ್ನು ಭೇಟಿಯಾಗಿ.|आमतौर पर हल्का। घरेलू देखभाल काफी है; ठीक न हो तो डॉक्टर से मिलें।|సాధారణంగా స్వల్పం. ఇంటి సంరక్షణ చాలు; మెరుగుపడకపోతే వైద్యుడిని కలవండి.|பொதுவாக லேசானது. வீட்டு பராமரிப்பு போதும்; குணமாகாவிட்டால் மருத்துவரைப் பாருங்கள்.",
"Because severity is Severe, the risk level was raised.":"ತೀವ್ರತೆ ‘ತೀವ್ರ’ ಆಗಿರುವುದರಿಂದ ಅಪಾಯದ ಮಟ್ಟ ಹೆಚ್ಚಿಸಲಾಗಿದೆ.|गंभीरता ‘गंभीर’ होने से जोखिम स्तर बढ़ाया गया है।|తీవ్రత ‘తీవ్రం’ కావడంతో ప్రమాద స్థాయి పెంచబడింది.|தீவிரம் ‘கடுமை’ என்பதால் ஆபத்து நிலை உயர்த்தப்பட்டது.",
"What to do now":"ಈಗ ಮಾಡಬೇಕಾದದ್ದು|अभी क्या करें|ఇప్పుడు ఏమి చేయాలి|இப்போது செய்ய வேண்டியது",
"What to take (OTC, adults)":"ಏನು ತೆಗೆದುಕೊಳ್ಳಬೇಕು (ಅಂಗಡಿಯಲ್ಲಿ ಸಿಗುವ, ವಯಸ್ಕರಿಗೆ)|क्या लें (बिना पर्चे की, वयस्कों के लिए)|ఏమి తీసుకోవాలి (షాపులో దొరికేవి, పెద్దలకు)|என்ன எடுக்க வேண்டும் (கடையில் கிடைக்கும், பெரியவர்களுக்கு)",
"Care at home":"ಮನೆಯಲ್ಲಿ ಆರೈಕೆ|घर पर देखभाल|ఇంట్లో సంరక్షణ|வீட்டில் பராமரிப்பு",
"Get urgent help if":"ಈ ಲಕ್ಷಣ ಕಂಡರೆ ತಕ್ಷಣ ಸಹಾಯ ಪಡೆಯಿರಿ|ये हो तो तुरंत मदद लें|ఇవి ఉంటే వెంటనే సహాయం పొందండి|இவை இருந்தால் உடனே உதவி பெறுங்கள்",
"No medicines are suggested for this condition. Follow the steps above and see a doctor first.":"ಈ ಸ್ಥಿತಿಗೆ ಯಾವುದೇ ಔಷಧಿ ಸೂಚಿಸಿಲ್ಲ. ಮೇಲಿನ ಹಂತಗಳನ್ನು ಪಾಲಿಸಿ ಮತ್ತು ಮೊದಲು ವೈದ್ಯರನ್ನು ಭೇಟಿಯಾಗಿ.|इस स्थिति के लिए कोई दवा नहीं सुझाई गई। ऊपर के कदम अपनाएं और पहले डॉक्टर से मिलें।|ఈ పరిస్థితికి మందులు సూచించలేదు. పై దశలు పాటించి ముందు వైద్యుడిని కలవండి.|இந்த நிலைக்கு மருந்து எதுவும் பரிந்துரைக்கப்படவில்லை. மேலே உள்ளவற்றைப் பின்பற்றி முதலில் மருத்துவரைப் பாருங்கள்.",
"Over-the-counter medicines for adults. Children, pregnant women and people with other illnesses must ask a doctor first.":"ಅಂಗಡಿಯಲ್ಲಿ ಸಿಗುವ ವಯಸ್ಕರ ಔಷಧಿಗಳು. ಮಕ್ಕಳು, ಗರ್ಭಿಣಿಯರು ಮತ್ತು ಬೇರೆ ಕಾಯಿಲೆ ಇರುವವರು ಮೊದಲು ವೈದ್ಯರನ್ನು ಕೇಳಬೇಕು.|बिना पर्चे की वयस्कों की दवाएं। बच्चे, गर्भवती महिलाएं और अन्य बीमारी वाले पहले डॉक्टर से पूछें।|షాపులో దొరికే పెద్దల మందులు. పిల్లలు, గర్భిణులు, ఇతర వ్యాధులున్నవారు ముందు వైద్యుడిని అడగాలి.|கடையில் கிடைக்கும் பெரியவர்களுக்கான மருந்துகள். குழந்தைகள், கர்ப்பிணிகள், வேறு நோய் உள்ளவர்கள் முதலில் மருத்துவரிடம் கேட்க வேண்டும்.",
[C1]:"ಚೆನ್ನಾಗಿ ವಿಶ್ರಾಂತಿ ಪಡೆಯಿರಿ, ಸಾಕಷ್ಟು ನೀರು ಕುಡಿಯಿರಿ.|अच्छी तरह आराम करें और खूब तरल पिएं।|బాగా విశ్రాంతి తీసుకోండి, ఎక్కువ ద్రవాలు తాగండి.|நன்றாக ஓய்வெடுங்கள், நிறைய திரவங்கள் குடியுங்கள்.",
[C2]:"ಹಗುರವಾದ ಮನೆ ಊಟ ಮಾಡಿ.|हल्का घर का खाना खाएं।|తేలికైన ఇంటి భోజనం తినండి.|இலகுவான வீட்டு உணவை உண்ணுங்கள்.",
[C3]:"ಪ್ರತಿ ಭೇದಿ ಅಥವಾ ವಾಂತಿಯ ನಂತರ ಒಆರ್‌ಎಸ್ ನಿಧಾನವಾಗಿ ಕುಡಿಯಿರಿ.|हर दस्त या उल्टी के बाद ओआरएस धीरे-धीरे पिएं।|ప్రతి విరేచనం లేదా వాంతి తర్వాత ఓఆర్‌ఎస్ నెమ్మదిగా తాగండి.|ஒவ்வொரு வயிற்றுப்போக்கு அல்லது வாந்திக்குப் பின் ORS மெதுவாகக் குடியுங்கள்.",
[C4]:"ಜ್ವರಕ್ಕೆ ಐಬುಪ್ರೊಫೆನ್ ಅಥವಾ ಆಸ್ಪಿರಿನ್ ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ.|बुखार में इबुप्रोफेन या एस्पिरिन न लें।|జ్వరానికి ఇబుప్రొఫెన్ లేదా ఆస్పిరిన్ తీసుకోవద్దు.|காய்ச்சலுக்கு இபுப்ரோஃபென் அல்லது ஆஸ்பிரின் எடுக்காதீர்கள்.",
[C5]:"ಬೆಚ್ಚಗಿನ ಉಪ್ಪು ನೀರಿನಲ್ಲಿ ಗಾರ್ಗಲ್ ಮಾಡಿ, ಹಬೆ ತೆಗೆದುಕೊಳ್ಳಿ.|गुनगुने नमक के पानी से गरारे करें और भाप लें।|గోరువెచ్చని ఉప్పు నీటితో పుక్కిలించండి, ఆవిరి పట్టండి.|வெதுவெதுப்பான உப்பு நீரில் கொப்பளித்து ஆவி பிடியுங்கள்.",
[C6]:"ಕತ್ತಲೆಯ ಶಾಂತ ಕೋಣೆಯಲ್ಲಿ ವಿಶ್ರಾಂತಿ ಪಡೆಯಿರಿ.|अंधेरे, शांत कमरे में आराम करें।|చీకటి, ప్రశాంత గదిలో విశ్రాంతి తీసుకోండి.|இருட்டான, அமைதியான அறையில் ஓய்வெடுங்கள்.",
[C7]:"ನೋವಿರುವ ಜಾಗಕ್ಕೆ ಬೆಚ್ಚಗಿನ ಶಾಖ ಕೊಡಿ.|दर्द वाली जगह पर गर्म सेंक करें।|నొప్పి ఉన్న చోట వెచ్చని కాపడం పెట్టండి.|வலி உள்ள இடத்தில் சூடான ஒத்தடம் கொடுங்கள்.",
[C8]:"ಕೆರೆಯಬೇಡಿ; ಚರ್ಮವನ್ನು ಸ್ವಚ್ಛ ಮತ್ತು ಒಣಗಿಸಿ ಇಡಿ.|खुजलाएं नहीं; त्वचा साफ और सूखी रखें।|గోకవద్దు; చర్మాన్ని శుభ్రంగా, పొడిగా ఉంచండి.|சொறியாதீர்கள்; தோலைச் சுத்தமாகவும் உலர்வாகவும் வைத்திருங்கள்.",
[C9]:"ಖಾರ, ಎಣ್ಣೆ ಪದಾರ್ಥ ತಪ್ಪಿಸಿ; ಊಟವಾದ ತಕ್ಷಣ ಮಲಗಬೇಡಿ.|मसालेदार, तैलीय खाना न खाएं; खाने के तुरंत बाद न लेटें।|కారం, నూనె పదార్థాలు మానండి; తిన్న వెంటనే పడుకోవద్దు.|காரம், எண்ணெய் உணவைத் தவிர்க்கவும்; சாப்பிட்டவுடன் படுக்காதீர்கள்.",
[W1]:"ಜ್ವರ 3 ದಿನಕ್ಕಿಂತ ಹೆಚ್ಚು ಇದ್ದರೆ ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ.|बुखार 3 दिन से ज्यादा रहे तो अस्पताल जाएं।|జ్వరం 3 రోజులకు మించి ఉంటే ఆసుపత్రికి వెళ్లండి.|காய்ச்சல் 3 நாட்களுக்கு மேல் நீடித்தால் மருத்துவமனைக்குச் செல்லுங்கள்.",
[W2]:"ನೀರು ಕುಡಿಯಲು ಆಗದಿದ್ದರೆ, ಮೂತ್ರ ತುಂಬಾ ಕಡಿಮೆ ಆದರೆ, ಅಥವಾ ತುಂಬಾ ಸುಸ್ತು/ತಲೆತಿರುಗಿದರೆ ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ.|तरल न पी पाएं, पेशाब बहुत कम हो, या बहुत कमजोरी/चक्कर हो तो अस्पताल जाएं।|ద్రవాలు తాగలేకపోతే, మూత్రం చాలా తక్కువగా వస్తే, లేదా చాలా నీరసం/తల తిరుగుతుంటే ఆసుపత్రికి వెళ్లండి.|திரவம் குடிக்க முடியாவிட்டால், சிறுநீர் மிகக் குறைவாக இருந்தால், அல்லது மிகவும் சோர்வு/தலைச்சுற்றல் இருந்தால் மருத்துவமனைக்குச் செல்லுங்கள்.",
[W3]:"ಮಲ ಅಥವಾ ವಾಂತಿಯಲ್ಲಿ ರಕ್ತ, ಕಪ್ಪು ಮಲ, ಅಥವಾ ತೀವ್ರ ಹೊಟ್ಟೆ ನೋವು ಇದ್ದರೆ ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ.|मल या उल्टी में खून, काला मल, या तेज पेट दर्द हो तो अस्पताल जाएं।|మలం లేదా వాంతిలో రక్తం, నల్లని మలం, లేదా తీవ్రమైన కడుపు నొప్పి ఉంటే ఆసుపత్రికి వెళ్లండి.|மலம் அல்லது வாந்தியில் இரத்தம், கருப்பு மலம், அல்லது கடுமையான வயிற்று வலி இருந்தால் மருத்துவமனைக்குச் செல்லுங்கள்.",
[W5]:"ಹಠಾತ್ ತೀವ್ರ ತಲೆನೋವು, ದೌರ್ಬಲ್ಯ, ದೃಷ್ಟಿ ನಷ್ಟ, ಗೊಂದಲ ಅಥವಾ ಕುತ್ತಿಗೆ ಬಿಗಿತ ಇದ್ದರೆ ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ.|अचानक तेज सिरदर्द, कमजोरी, नजर जाना, भ्रम या गर्दन अकड़ना हो तो अस्पताल जाएं।|అకస్మాత్తుగా తీవ్ర తలనొప్పి, బలహీనత, చూపు పోవడం, గందరగోళం లేదా మెడ బిగుసుకుంటే ఆసుపత్రికి వెళ్లండి.|திடீர் கடுமையான தலைவலி, பலவீனம், பார்வை இழப்பு, குழப்பம் அல்லது கழுத்து இறுக்கம் இருந்தால் மருத்துவமனைக்குச் செல்லுங்கள்.",
[W6]:"ಮುಖ, ತುಟಿ ಅಥವಾ ಗಂಟಲು ಊದಿಕೊಂಡರೆ ಅಥವಾ ಉಸಿರಾಟ ಕಷ್ಟವಾದರೆ ಆಸ್ಪತ್ರೆಗೆ ಹೋಗಿ.|चेहरा, होंठ या गला सूजे, या सांस फूले तो अस्पताल जाएं।|ముఖం, పెదవులు లేదా గొంతు వాచినా, లేదా ఊపిరి ఆడకపోయినా ఆసుపత్రికి వెళ్లండి.|முகம், உதடு அல்லது தொண்டை வீங்கினால், அல்லது மூச்சுத் திணறினால் மருத்துவமனைக்குச் செல்லுங்கள்.",
[W7]:"3 ದಿನದಲ್ಲಿ ಸುಧಾರಿಸದಿದ್ದರೆ ವೈದ್ಯರನ್ನು ಭೇಟಿಯಾಗಿ.|3 दिन में ठीक न हो तो डॉक्टर से मिलें।|3 రోజుల్లో మెరుగుపడకపోతే వైద్యుడిని కలవండి.|3 நாட்களில் குணமாகாவிட்டால் மருத்துவரைப் பாருங்கள்.",
[EM[0]]:"ಈಗಲೇ 108 (ಆಂಬ್ಯುಲೆನ್ಸ್) ಅಥವಾ 112 ಗೆ ಕರೆ ಮಾಡಿ.|अभी 108 (एम्बुलेंस) या 112 पर कॉल करें।|వెంటనే 108 (అంబులెన్స్) లేదా 112 కు కాల్ చేయండి.|இப்போதே 108 (ஆம்புலன்ஸ்) அல்லது 112 ஐ அழையுங்கள்.",
[EM[1]]:"ನೇರವಾಗಿ ಕುಳಿತು ಶಾಂತವಾಗಿರಿ, ಶ್ರಮ ಪಡಬೇಡಿ.|सीधे बैठें, शांत रहें और मेहनत न करें।|నిటారుగా కూర్చోండి, ప్రశాంతంగా ఉండండి, శ్రమ పడవద్దు.|நேராக உட்காருங்கள், அமைதியாக இருங்கள், உடலை வருத்தாதீர்கள்.",
[EM[2]]:"ನೀವೇ ವಾಹನ ಓಡಿಸಬೇಡಿ; ಯಾರಾದರೂ ಹತ್ತಿರದ ಆಸ್ಪತ್ರೆಗೆ ಕರೆದುಕೊಂಡು ಹೋಗಲಿ.|खुद गाड़ी न चलाएं; किसी से नजदीकी अस्पताल ले जाने को कहें।|మీరే వాహనం నడపవద్దు; ఎవరినైనా సమీప ఆసుపత్రికి తీసుకెళ్లమనండి.|நீங்களே வாகனம் ஓட்டாதீர்கள்; யாராவது அருகிலுள்ள மருத்துவமனைக்கு அழைத்துச் செல்லட்டும்.",
[EM[3]]:"ವೈದ್ಯರು ಹೇಳದ ಹೊರತು ನೀವೇ ಯಾವುದೇ ಔಷಧಿ ತೆಗೆದುಕೊಳ್ಳಬೇಡಿ.|डॉक्टर के कहे बिना खुद कोई दवा न लें।|వైద్యుడు చెప్పకుండా మీరే ఏ మందూ వాడవద్దు.|மருத்துவர் சொல்லாமல் நீங்களே எந்த மருந்தும் எடுக்காதீர்கள்.",
[PA.n]:"ಪ್ಯಾರಸಿಟಮಾಲ್ 650 ಮಿ.ಗ್ರಾಂ|पैरासिटामोल 650 मि.ग्रा.|పారాసిటమాల్ 650 మి.గ్రా|பாராசிட்டமால் 650 மி.கி",

/* ---- UPI QR payment ---- */
function qrSvg(seed){
  const n=25;let x=seed*7919+13,d="";
  const r=()=>(x=(x*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const fp=(a,b)=>a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    let on;
    if(i<7&&j<7)on=fp(i,j);else if(i<7&&j>=n-7)on=fp(i,j-(n-7));else if(i>=n-7&&j<7)on=fp(i-(n-7),j);else on=r()>.5;
    if(on)d+="M"+j+" "+i+"h1v1h-1z";
  }
  return `<svg viewBox="-1 -1 27 27" width="180" height="180" role="img" aria-label="UPI QR" shape-rendering="crispEdges" style="background:#fff;border-radius:10px"><path d="${d}" fill="#000"/></svg>`;
}
function payFlow(amt,next){
  const ps=$("#ps");
  const ok=()=>{ps.textContent=tr("Payment successful!")+" ₹"+amt+" "+(S.lang==="en"?"via "+S.pay:tr(S.pay)+" "+tr("via"));setTimeout(next,800)};
  if(S.pay!=="UPI"){ps.textContent=tr("Processing payment...");setTimeout(ok,1200);return}
  ps.innerHTML=`<span style="display:block;text-align:center">${qrSvg(amt)}<br><b class="tot">₹${amt}</b><br>${tr("Scan this QR with any UPI app")}<br><span class="hint">${tr("Demo QR – no real money is charged")}</span><br>${tr("Waiting for payment…")}<br><button class="go" id="paid" type="button">${tr("I have paid")}</button></span>`;
  let done=false,tt=null;
  const fin=()=>{if(done)return;done=true;clearTimeout(tt);ps.textContent=tr("Processing payment...");setTimeout(ok,900)};
  tt=setTimeout(fin,9000);$("#paid").onclick=fin;
}

function ringOn(){try{const A=window.AudioContext||window.webkitAudioContext;S.ac=S.ac||new A();const beep=()=>{const o=S.ac.createOscillator(),g=S.ac.createGain();o.frequency.value=440;g.gain.value=.08;o.connect(g);g.connect(S.ac.destination);o.start();o.stop(S.ac.currentTime+.35)};beep();S.ri=setInterval(beep,1500)}catch(e){}}
function ringOff(){clearInterval(S.ri)}
function vCall(){return `<h2>${tr(S.mode)}</h2><div class="card call" id="cbx"></div>`}
function runCall(){
  const vd=S.mode==="Video call",box=$("#cbx"),ini=tr(S.doc.n).split(" ").slice(1).map(w=>w[0]).join("");
  let ci=null,stream=null;
  box.innerHTML=`<div class="av ring">${ini}</div><p class="tot">${esc(tr(S.doc.n))}</p><p id="cs" role="status">${tr("Calling")}…</p>`;
  ringOn();
  setTimeout(()=>{const c=$("#cs");if(c)c.textContent=tr("Ringing…")},1200);
  setTimeout(connect,4500);
  function connect(){
    if(S.step!==98)return;
    ringOff();
    box.innerHTML=`<div class="vid">${vd?`<div class="av">${ini}</div><div class="self" id="self">${tr("You")}</div>`:`<div><div class="av ring">${ini}</div><div class="wave"><i></i><i></i><i></i><i></i><i></i></div></div>`}</div>
<p class="tot">${esc(tr(S.doc.n))}</p><p role="status">${tr("Connected")} • <span id="tm">00:00</span></p>
<div class="row" style="justify-content:center"><button class="chip" id="mu" aria-pressed="false">🎙 ${tr("Mute")}</button>${vd?`<button class="chip" id="cmr" aria-pressed="false">📷 ${tr("Camera")}</button>`:""}<button class="go" id="end" style="background:var(--bad);margin:0">📞 ${tr("End call")}</button></div>`;
    let sec=0;ci=setInterval(()=>{sec++;const m=$("#tm");if(m)m.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")},1000);
    const tgl=e=>{const b=e.currentTarget;b.classList.toggle("on");b.setAttribute("aria-pressed",b.classList.contains("on"));return b.classList.contains("on")};
    $("#mu").onclick=tgl;
    if(vd){
      navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:true}).then(m=>{stream=m;const sf=$("#self");if(!sf){m.getTracks().forEach(t=>t.stop());return}sf.innerHTML="<video autoplay muted playsinline></video>";sf.firstChild.srcObject=m}).catch(()=>{});
      $("#cmr").onclick=e=>{const off=tgl(e);stream&&stream.getVideoTracks().forEach(t=>t.enabled=!off)};
    }
    $("#end").onclick=()=>{clearInterval(ci);stream&&stream.getTracks().forEach(t=>t.stop());go(5)};
  }
}

  if("speechSynthesis" in window)speechSynthesis.cancel();
  const said=S.chat.join(". ");
  matchSym(said).forEach(x=>{if(!S.visit.symptoms.includes(x))S.visit.symptoms=S.visit.symptoms.filter(y=>y!=="Unknown").concat(x)});
  if(said)S.visit.free=(S.visit.free?S.visit.free+" | ":"")+said;
  go(5)}
render();
</script>
